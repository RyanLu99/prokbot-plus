name: grokbot
services:
  host:
    image: ${GROKBOT_HOST_IMAGE:-grokbot-host:local}
    init: true
    restart: unless-stopped
    ports:
      - "${GROKBOT_LISTEN_ADDRESS:-127.0.0.1}:${GROKBOT_PUBLIC_PORT:-18080}:8000"
    environment:
      GROKBOT_PUBLIC_URL: ${GROKBOT_PUBLIC_URL:-}
      GROKBOT_BOX_HOST: box
      GROKBOT_VNC_URL: http://box:6080
      GROKBOT_FORK_VNC_URL: http://box:6081
      TZ: ${TZ:-Asia/Singapore}
    volumes:
      - host-data:/data
    depends_on:
      - box
    stop_grace_period: 25s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  box:
    image: ${GROKBOT_BOX_IMAGE:-grokbot-box-input:9d2ac1b}
    platform: linux/amd64
    restart: unless-stopped
    shm_size: 1gb
    volumes:
      - box-home:/home/box
      - box-workspace:/workspace
      # The original Host gives the execution desktop only these data trees.
      # Mounting each parent means newly created Agents are visible without a new mount.
      - type: volume
        source: host-data
        target: /home/box/sand-data/agents
        volume: { subpath: runtime/host-data/agents }
      - type: volume
        source: host-data
        target: /home/box/sand-data/agent-transcripts
        volume: { subpath: runtime/host-data/agent-transcripts }
      - type: volume
        source: host-data
        target: /home/box/sand-data/user-memory
        volume: { subpath: runtime/host-data/user-memory }
      - type: volume
        source: host-data
        target: /home/box/sand-data/workflows
        volume: { subpath: runtime/host-data/workflows }
      - type: volume
        source: host-data
        target: /home/box/sand-data/plugins
        volume: { subpath: runtime/host-data/plugins }
      - type: volume
        source: host-data
        target: /home/box/sand-data/managed-skills
        volume: { subpath: runtime/host-data/managed-skills }
      # Some original tools use the Host's absolute data path instead of agent-data.
      - type: volume
        source: host-data
        target: /data/runtime/host-data/agents
        volume: { subpath: runtime/host-data/agents }
      - type: volume
        source: host-data
        target: /data/runtime/host-data/agent-transcripts
        volume: { subpath: runtime/host-data/agent-transcripts }
      - type: volume
        source: host-data
        target: /data/runtime/host-data/user-memory
        volume: { subpath: runtime/host-data/user-memory }
      - type: volume
        source: host-data
        target: /data/runtime/host-data/workflows
        volume: { subpath: runtime/host-data/workflows }
      - type: volume
        source: host-data
        target: /data/runtime/host-data/plugins
        volume: { subpath: runtime/host-data/plugins }
      - type: volume
        source: host-data
        target: /data/runtime/host-data/managed-skills
        volume: { subpath: runtime/host-data/managed-skills }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
volumes:
  host-data:
    name: ${COMPOSE_PROJECT_NAME}_host-data
    external: ${PROKBOT_EXISTING_VOLUMES:-false}
  box-home:
    name: ${COMPOSE_PROJECT_NAME}_box-home
    external: ${PROKBOT_EXISTING_VOLUMES:-false}
  box-workspace:
    name: ${COMPOSE_PROJECT_NAME}_box-workspace
    external: ${PROKBOT_EXISTING_VOLUMES:-false}
